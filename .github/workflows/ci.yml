
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Lint with Ruff
        run: |
          pip install ruff
          ruff check . --select E9,F63,F7,F82

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache keeps PyTorch from being reinstalled on every run
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: fl-experiment:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit tests
        run: |
          docker run --rm \
            -v "$PWD/tests:/app/tests:ro" \
            fl-experiment:latest \
            python -m unittest discover -s /app/tests -v
            
      # The blank CI machine has no data, so download and split MNIST first
      - name: Prepare the data
        run: |
          mkdir -p results
          docker compose run --rm --no-deps --user "$(id -u):$(id -g)" prepare-data

      - name: Smoke test
        run: |
          docker compose run --rm --no-deps --user "$(id -u):$(id -g)" experiment1 \
            python experiment_runner.py experiments_config/smoke.yaml
          ls results/*/FedAvg_mnist_LG.pkl

      # Everything below only runs on pushes to main, after all checks passed
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      # Publish the same image that just passed the tests
      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/dafnepap/fl_experiment_pipeline
          docker tag fl-experiment:latest "$IMAGE:latest"
          docker tag fl-experiment:latest "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
